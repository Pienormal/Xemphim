<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stremio Web</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --card-bg: #181818;
            --accent-color: #7b2cbf;
            --accent-hover: #9d4edd;
            --text-main: #ffffff;
            --text-muted: #888888;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0 0 80px 0;
            -webkit-user-select: none;
        }
        /* Search Bar Header */
        .header-container {
            padding: 20px 16px 10px 16px;
            display: flex;
            justify-content: center;
            background: linear-gradient(to bottom, #000 0%, var(--bg-color) 100%);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .search-box {
            position: relative;
            width: 100%;
            max-width: 600px;
        }
        .search-box input {
            width: 100%;
            padding: 12px 20px 12px 45px;
            background-color: #1a1a1a;
            border: 1px solid #333;
            border-radius: 30px;
            color: #fff;
            font-size: 15px;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        .search-box input:focus {
            border-color: var(--accent-color);
        }
        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 16px;
        }

        /* Views Container */
        .view-section {
            display: none;
            padding: 10px 16px;
        }
        .view-section.active {
            display: block;
        }

        /* Rows & Horizontal Scroll */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 20px 0 10px 0;
        }
        .section-title {
            color: var(--text-main);
            font-size: 17px;
            font-weight: bold;
        }
        .movie-row {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 10px;
            scrollbar-width: none; /* Firefox */
        }
        .movie-row::-webkit-scrollbar {
            display: none; /* Chrome/Safari */
        }

        /* Movie Card */
        .movie-card {
            flex: 0 0 130px;
            background-color: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 2px solid transparent;
        }
        .movie-card:focus, .movie-card:hover {
            transform: scale(1.05);
            border-color: var(--accent-color);
            outline: none;
            box-shadow: 0 4px 20px rgba(123, 44, 191, 0.4);
        }
        .movie-card img {
            width: 130px;
            height: 190px;
            object-fit: cover;
            background-color: #222;
            display: block;
        }
        .movie-title {
            padding: 8px;
            font-size: 12px;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #ddd;
        }

        /* Grid for Discover/Search */
        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 12px;
            margin-top: 10px;
        }
        .movie-grid .movie-card {
            flex: unset;
            width: 100%;
        }
        .movie-grid .movie-card img {
            width: 100%;
            height: 190px;
        }

        /* Filter Chips */
        .filter-container {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            margin-bottom: 15px;
            scrollbar-width: none;
        }
        .filter-container::-webkit-scrollbar { display: none; }
        .chip {
            padding: 6px 14px;
            background-color: #1a1a1a;
            border: 1px solid #333;
            border-radius: 20px;
            font-size: 13px;
            color: #aaa;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .chip.active, .chip:hover {
            background-color: var(--accent-color);
            color: #fff;
            border-color: var(--accent-color);
        }

        /* Bottom Navigation Bar */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 65px;
            background-color: #121212;
            border-top: 1px solid #222;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
        }
        .nav-item {
            background: none;
            border: none;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 11px;
            cursor: pointer;
            gap: 4px;
            transition: color 0.2s;
        }
        .nav-item svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }
        .nav-item.active {
            color: var(--accent-color);
        }

        /* Video Player Modal */
        #player-container {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.98);
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 2000;
        }
        video {
            width: 85%;
            height: 85%;
            background: #000;
        }
        .close-btn {
            margin-top: 15px;
            padding: 10px 24px;
            background: var(--accent-color);
            color: #fff;
            border: none;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            font-size: 15px;
        }
    </style>
</head>
<body>

    <!-- Header Search Bar -->
    <div class="header-container">
        <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="search-input" placeholder="You can search anything..." onkeypress="handleSearchKey(event)">
        </div>
    </div>

    <!-- TAB 1: HOME -->
    <div id="view-home" class="view-section active">
        <div id="home-content">
            <div style="text-align: center; color: var(--text-muted); margin-top: 60px;">Đang tải trang chủ...</div>
        </div>
    </div>

    <!-- TAB 2: DISCOVER (Quốc gia & Thể loại) -->
    <div id="view-discover" class="view-section">
        <div class="section-title" style="margin-bottom: 8px;">Quốc gia</div>
        <div id="country-filters" class="filter-container"></div>

        <div class="section-title" style="margin-bottom: 8px;">Thể loại</div>
        <div id="genre-filters" class="filter-container"></div>

        <div id="discover-grid" class="movie-grid"></div>
    </div>

    <!-- TAB 3: SEARCH RESULTS VIEW -->
    <div id="view-search" class="view-section">
        <div class="section-title" id="search-heading">Kết quả tìm kiếm</div>
        <div id="search-grid" class="movie-grid"></div>
    </div>

    <!-- TAB 4: SETTINGS -->
    <div id="view-settings" class="view-section">
        <div class="section-title">Cài đặt hệ thống</div>
        <p style="color: var(--text-muted); font-size: 14px;">Stremio Web v1.0 - Clean & Fast</p>
        <p style="color: var(--text-muted); font-size: 14px;">Nguồn dữ liệu: KKPhim API v1</p>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="bottom-nav">
        <button class="nav-item active" onclick="switchTab('home', this)">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            Home
        </button>
        <button class="nav-item" onclick="switchTab('discover', this)">
            <svg viewBox="0 0 24 24"><path d="M12 10.9c-.61 0-1.1.49-1.1 1.1s.49 1.1 1.1 1.1c.61 0 1.1-.49 1.1-1.1s-.49-1.1-1.1-1.1zM12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm2.19 12.19L6 18l3.81-8.19L18 6l-3.81 8.19z"/></svg>
            Discover
        </button>
        <button class="nav-item" onclick="switchTab('settings', this)">
            <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
            Settings
        </button>
    </div>

    <!-- Video Player Modal -->
    <div id="player-container">
        <video id="video-player" controls autoplay></video>
        <button class="close-btn" onclick="closePlayer()">Đóng phát</button>
    </div>

    <script>
        const API_HOME = 'https://phimapi.com/v1/api/home';
        const API_GENRES = 'https://phimapi.com/the-loai';
        
        let selectedCountry = 'han-quoc';
        let selectedGenre = '';

        // Chuyển tab giao diện
        function switchTab(tabName, btnElement) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

            if (tabName === 'home') {
                document.getElementById('view-home').classList.add('active');
            } else if (tabName === 'discover') {
                document.getElementById('view-discover').classList.add('active');
                loadDiscoverData();
            } else if (tabName === 'settings') {
                document.getElementById('view-settings').classList.add('active');
            }
            if (btnElement) btnElement.classList.add('active');
        }

        // Xử lý ảnh
        function getImageUrl(path) {
            if (!path) return '';
            if (path.startsWith('http://') || path.startsWith('https://')) return path;
            return `https://phimapi.com${path.startsWith('/') ? path : '/' + path}`;
        }

        // Tạo thẻ card phim
        function createMovieCard(movie) {
            let card = document.createElement('div');
            card.className = 'movie-card';
            card.tabIndex = 0;
            let rawImg = movie.thumb_url || movie.poster_url || '';
            let thumbURL = getImageUrl(rawImg);

            card.innerHTML = `
                <img src="${thumbURL}" alt="${movie.name}" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'130\' height=\'190\' viewBox=\'0 0 130 190\'><rect width=\'130\' height=\'190\' fill=\'%231a1a1a\'/><text x=\'50%\' y=\'50%\' fill=\'%23666\' font-size=\'12\' font-family=\'Arial\' text-anchor=\'middle\' dy=\'.3em\'>No Image</text></svg>';">
                <div class="movie-title">${movie.name}</div>
            `;
            card.onclick = () => getMovieDetails(movie.slug);
            return card;
        }

        // 1. Load Trang Chủ
        async function fetchHome() {
            try {
                let res = await fetch(API_HOME, { headers: { accept: 'application/json' } });
                let json = await res.json();
                let dataBlock = json.data || json;
                let container = document.getElementById('home-content');
                container.innerHTML = '';

                renderHorizontalRow(container, "Phim Mới Cập Nhật", dataBlock.items || dataBlock.phimmoi);
                renderHorizontalRow(container, "Phim Lẻ Phổ Biến", dataBlock.phimle);
                renderHorizontalRow(container, "Phim Bộ Phổ Biến", dataBlock.phimbo);
                renderHorizontalRow(container, "Hoạt Hình", dataBlock.hoathinh);

            } catch (err) {
                console.error(err);
                document.getElementById('home-content').innerHTML = '<div style="text-align:center; color:red; margin-top:40px;">Không thể tải dữ liệu trang chủ.</div>';
            }
        }

        function renderHorizontalRow(container, titleText, movieList) {
            if (!movieList || movieList.length === 0) return;

            let header = document.createElement('div');
            header.className = 'section-header';
            header.innerHTML = `<div class="section-title">${titleText}</div>`;
            container.appendChild(header);

            let row = document.createElement('div');
            row.className = 'movie-row';

            movieList.forEach(movie => {
                row.appendChild(createMovieCard(movie));
            });

            container.appendChild(row);
        }

        // 2. Load Discover (Quốc gia & Thể loại)
        async function loadDiscoverData() {
            // Render danh sách quốc gia cố định phổ biến
            let countries = [
                { name: 'Hàn Quốc', slug: 'han-quoc' },
                { name: 'Trung Quốc', slug: 'trung-quoc' },
                { name: 'Mỹ', slug: 'au-my' },
                { name: 'Nhật Bản', slug: 'nhat-ban' },
                { name: 'Thái Lan', slug: 'thai-lan' }
            ];

            let countryContainer = document.getElementById('country-filters');
            countryContainer.innerHTML = '';
            countries.forEach(c => {
                let chip = document.createElement('div');
                chip.className = `chip ${selectedCountry === c.slug ? 'active' : ''}`;
                chip.innerText = c.name;
                chip.onclick = () => {
                    selectedCountry = c.slug;
                    loadDiscoverData();
                };
                countryContainer.appendChild(chip);
            });

            // Lấy thể loại từ API
            try {
                let res = await fetch(API_GENRES);
                let genres = await res.json();
                let genreContainer = document.getElementById('genre-filters');
                genreContainer.innerHTML = '';
                
                // Nút tất cả thể loại
                let allChip = document.createElement('div');
                allChip.className = `chip ${!selectedGenre ? 'active' : ''}`;
                allChip.innerText = 'Tất cả';
                allChip.onclick = () => { selectedGenre = ''; loadDiscoverData(); };
                genreContainer.appendChild(allChip);

                genres.forEach(g => {
                    let chip = document.createElement('div');
                    chip.className = `chip ${selectedGenre === g.slug ? 'active' : ''}`;
                    chip.innerText = g.name;
                    chip.onclick = () => {
                        selectedGenre = g.slug;
                        loadDiscoverData();
                    };
                    genreContainer.appendChild(chip);
                });
            } catch(e) { console.error(e); }

            // Fetch phim theo quốc gia hoặc thể loại
            fetchFilteredMovies();
        }

        async function fetchFilteredMovies() {
            let grid = document.getElementById('discover-grid');
            grid.innerHTML = '<div style="color:var(--text-muted); grid-column: 1/-1; text-align:center; padding:20px;">Đang tải...</div>';
            
            let url = `https://phimapi.com/v1/api/quoc-gia/${selectedCountry}?limit=24`;
            if (selectedGenre) {
                url = `https://phimapi.com/v1/api/the-loai/${selectedGenre}?limit=24`;
            }

            try {
                let res = await fetch(url);
                let json = await res.json();
                let items = json.data?.items || json.items || [];
                
                grid.innerHTML = '';
                if (items.length === 0) {
                    grid.innerHTML = '<div style="color:var(--text-muted); grid-column: 1/-1; text-align:center;">Không tìm thấy phim phù hợp.</div>';
                    return;
                }
                items.forEach(movie => grid.appendChild(createMovieCard(movie)));
            } catch (err) {
                grid.innerHTML = '<div style="color:red; grid-column: 1/-1; text-align:center;">Lỗi tải dữ liệu.</div>';
            }
        }

        // 3. Tìm kiếm phim
        function handleSearchKey(event) {
            if (event.key === 'Enter') {
                let keyword = document.getElementById('search-input').value.trim();
                if (keyword) performSearch(keyword);
            }
        }

        async function performSearch(keyword) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.getElementById('view-search').classList.add('active');
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

            let grid = document.getElementById('search-grid');
            document.getElementById('search-heading').innerText = `Kết quả tìm kiếm: "${keyword}"`;
            grid.innerHTML = '<div style="color:var(--text-muted); grid-column: 1/-1; text-align:center; padding:20px;">Đang tìm kiếm...</div>';

            try {
                let res = await fetch(`https://phimapi.com/v1/api/tim-kiem?keyword=${encodeURIComponent(keyword)}&limit=20`);
                let json = await res.json();
                let items = json.data?.items || json.items || [];

                grid.innerHTML = '';
                if (items.length === 0) {
                    grid.innerHTML = '<div style="color:var(--text-muted); grid-column: 1/-1; text-align:center;">Không tìm thấy bộ phim nào.</div>';
                    return;
                }
                items.forEach(movie => grid.appendChild(createMovieCard(movie)));
            } catch (err) {
                grid.innerHTML = '<div style="color:red; grid-column: 1/-1; text-align:center;">Lỗi kết nối tìm kiếm.</div>';
            }
        }

        // 4. Xem chi tiết & Phát video
        async function getMovieDetails(slug) {
            try {
                let res = await fetch(`https://phimapi.com/phim/${slug}`);
                let data = await res.json();
                let episodes = data.episodes;
                if (episodes && episodes.length > 0) {
                    let serverData = episodes[0].server_data;
                    if (serverData && serverData.length > 0) {
                        let playUrl = serverData[0].link_m3u8;
                        if (playUrl) {
                            playVideo(playUrl);
                            return;
                        }
                    }
                }
                alert('Phim này hiện chưa có link phát video!');
            } catch (error) {
                alert('Không thể lấy chi tiết phim!');
            }
        }

        function playVideo(url) {
            const container = document.getElementById('player-container');
            const video = document.getElementById('video-player');
            container.style.display = 'flex';

            if (url.includes('.m3u8')) {
                if (Hls.isSupported()) {
                    if (window.hlsInstance) window.hlsInstance.destroy();
                    const hls = new Hls();
                    window.hlsInstance = hls;
                    hls.loadSource(url);
                    hls.attachMedia(video);
                    hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(e => {}));
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = url;
                    video.play();
                }
            } else {
                video.src = url;
                video.play().catch(e => {});
            }
        }

        function closePlayer() {
            const container = document.getElementById('player-container');
            const video = document.getElementById('video-player');
            video.pause();
            video.src = '';
            if (window.hlsInstance) window.hlsInstance.destroy();
            container.style.display = 'none';
        }

        // Khởi chạy ban đầu
        fetchHome();
    </script>
</body>
</html>
