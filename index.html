<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stremio Web</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --card-bg: #181818;
            --accent-color: #7b2cbf;
            --accent-hover: #9d4edd;
            --text-main: #ffffff;
            --text-muted: #888888;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0 0 80px 0;
            -webkit-user-select: none;
        }
        /* Search Bar Header */
        .header-container {
            padding: 20px 16px 10px 16px;
            display: flex;
            justify-content: center;
            background: linear-gradient(to bottom, #000 0%, var(--bg-color) 100%);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .search-box {
            position: relative;
            width: 100%;
            max-width: 600px;
        }
        .search-box input {
            width: 100%;
            padding: 12px 20px;
            background-color: #1a1a1a;
            border: 1px solid #333;
            border-radius: 30px;
            color: #fff;
            font-size: 15px;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.2s;
            text-align: center;
        }
        .search-box input:focus {
            border-color: var(--accent-color);
            text-align: left;
            padding-left: 20px;
        }

        /* Views Container */
        .view-section {
            display: none;
            padding: 10px 16px;
        }
        .view-section.active {
            display: block;
        }

        /* Rows & Grid for Home Categories */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 20px 0 10px 0;
        }
        .section-title {
            color: var(--text-main);
            font-size: 17px;
            font-weight: bold;
        }
        .movie-grid-row {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 12px;
            margin-bottom: 10px;
        }
        @media (max-width: 1200px) {
            .movie-grid-row {
                grid-template-columns: repeat(4, 1fr);
            }
        }
        @media (max-width: 600px) {
            .movie-grid-row {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* Movie Card */
        .movie-card {
            background-color: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 2px solid transparent;
        }
        .movie-card:focus, .movie-card:hover {
            transform: scale(1.05);
            border-color: var(--accent-color);
            outline: none;
            box-shadow: 0 4px 20px rgba(123, 44, 191, 0.4);
        }
        .movie-card img {
            width: 100%;
            height: 190px;
            object-fit: cover;
            background-color: #222;
            display: block;
        }
        .movie-title {
            padding: 8px;
            font-size: 12px;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #ddd;
        }

        /* Grid for Discover/Search */
        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 12px;
            margin-top: 10px;
        }
        .movie-grid .movie-card img {
            height: 190px;
        }

        /* Pagination Style */
        .pagination-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin: 15px 0 25px 0;
        }
        .pagination-btn {
            padding: 6px 14px;
            background-color: var(--accent-color);
            color: #fff;
            border: none;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            font-size: 13px;
            transition: background 0.2s;
        }
        .pagination-btn:hover {
            background-color: var(--accent-hover);
        }
        .pagination-btn:disabled {
            background-color: #222;
            color: #555;
            cursor: not-allowed;
        }
        .page-indicator {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: bold;
        }

        /* Filter Chips */
        .filter-container {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            margin-bottom: 15px;
            scrollbar-width: none;
        }
        .filter-container::-webkit-scrollbar { display: none; }
        .chip {
            padding: 6px 14px;
            background-color: #1a1a1a;
            border: 1px solid #333;
            border-radius: 20px;
            font-size: 13px;
            color: #aaa;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .chip.active, .chip:hover {
            background-color: var(--accent-color);
            color: #fff;
            border-color: var(--accent-color);
        }

        /* Bottom Navigation Bar */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 65px;
            background-color: #121212;
            border-top: 1px solid #222;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
        }
        .nav-item {
            background: none;
            border: none;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 11px;
            cursor: pointer;
            gap: 4px;
            transition: color 0.2s;
        }
        .nav-item svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }
        .nav-item.active {
            color: var(--accent-color);
        }

        /* Video Player Modal */
        #player-container {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.98);
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 2000;
        }
        video {
            width: 85%;
            height: 85%;
            background: #000;
        }
        .close-btn {
            margin-top: 15px;
            padding: 10px 24px;
            background: var(--accent-color);
            color: #fff;
            border: none;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            font-size: 15px;
        }
    </style>
</head>
<body>

    <!-- Header Search Bar -->
    <div class="header-container">
        <div class="search-box">
            <input type="text" id="search-input" placeholder="You can search anything..." onkeypress="handleSearchKey(event)">
        </div>
    </div>

    <!-- TAB 1: HOME -->
    <div id="view-home" class="view-section active">
        <div id="home-content">
            <div style="text-align: center; color: var(--text-muted); margin-top: 60px;">Đang tải trang chủ...</div>
        </div>
    </div>

    <!-- TAB 2: DISCOVER -->
    <div id="view-discover" class="view-section">
        <div class="section-title" style="margin-bottom: 8px;">Quốc gia</div>
        <div id="country-filters" class="filter-container"></div>

        <div class="section-title" style="margin-bottom: 8px;">Thể loại</div>
        <div id="genre-filters" class="filter-container"></div>

        <div id="discover-grid" class="movie-grid"></div>

        <div class="pagination-container">
            <button class="pagination-btn" id="prev-page-btn" onclick="changeDiscoverPage(-1)">Trang trước</button>
            <span class="page-indicator" id="page-indicator">Trang 1</span>
            <button class="pagination-btn" id="next-page-btn" onclick="changeDiscoverPage(1)">Trang sau</button>
        </div>
    </div>

    <!-- TAB 3: SEARCH RESULTS VIEW -->
    <div id="view-search" class="view-section">
        <div class="section-title" id="search-heading">Kết quả tìm kiếm</div>
        <div id="search-grid" class="movie-grid"></div>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="bottom-nav">
        <button class="nav-item active" onclick="switchTab('home', this)">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            Home
        </button>
        <button class="nav-item" onclick="switchTab('discover', this)">
            <svg viewBox="0 0 24 24"><path d="M12 10.9c-.61 0-1.1.49-1.1 1.1s.49 1.1 1.1 1.1c.61 0 1.1-.49 1.1-1.1s-.49-1.1-1.1-1.1zM12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm2.19 12.19L6 18l3.81-8.19L18 6l-3.81 8.19z"/></svg>
            Discover
        </button>
    </div>

    <!-- Video Player Modal -->
    <div id="player-container">
        <video id="video-player" controls autoplay></video>
        <button class="close-btn" onclick="closePlayer()">Đóng phát</button>
    </div>

    <script>
        const API_HOME = 'https://phimapi.com/v1/api/home';
        const API_GENRES = 'https://phimapi.com/the-loai';
        
        let selectedCountry = 'han-quoc';
        let selectedGenre = '';
        let currentDiscoverPage = 1;
        let homeCategories = {};

        function switchTab(tabName, btnElement) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

            if (tabName === 'home') {
                document.getElementById('view-home').classList.add('active');
            } else if (tabName === 'discover') {
                document.getElementById('view-discover').classList.add('active');
                loadDiscoverData();
            }
            if (btnElement) btnElement.classList.add('active');
        }

        function getImageUrl(path) {
            if (!path) return '';
            if (path.startsWith('http://') || path.startsWith('https://')) return path;
            return `https://phimapi.com${path.startsWith('/') ? path : '/' + path}`;
        }

        // Hàm thông minh tự động đổi nguồn ảnh dự phòng khi ảnh gốc lỗi
        function handleImageError(imgElement, slug, movieName) {
            imgElement.onerror = null; // Chống lặp vô hạn
            
            // Nếu có slug, ưu tiên tìm ảnh poster dự phòng theo chuẩn cấu trúc tên miền ảnh phổ biến hoặc tự tạo placeholder đẹp
            if (slug) {
                imgElement.src = `https://img.phimapi.com/thumb/${slug}.jpg`;
                // Nếu nguồn phụ vẫn lỗi, hiển thị khung SVG xám kèm tên phim rõ ràng
                imgElement.onerror = function() {
                    this.src = `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="130" height="190" viewBox="0 0 130 190"><rect width="130" height="190" fill="%231a1a1a"/><text x="50%" y="50%" fill="%23aaa" font-size="11" font-family="Arial" text-anchor="middle" width="120"><tspan x="50%" dy="-10">${encodeURIComponent(movieName || 'No Image')}</tspan></text></svg>`;
                };
            } else {
                imgElement.src = `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="130" height="190" viewBox="0 0 130 190"><rect width="130" height="190" fill="%231a1a1a"/><text x="50%" y="50%" fill="%23666" font-size="12" font-family="Arial" text-anchor="middle" dy=".3em">No Image</text></svg>`;
            }
        }

        function createMovieCard(movie) {
            let card = document.createElement('div');
            card.className = 'movie-card';
            card.tabIndex = 0;
            let rawImg = movie.thumb_url || movie.poster_url || '';
            let thumbURL = getImageUrl(rawImg);
            let slug = movie.slug || '';
            let movieName = movie.name || '';

            card.innerHTML = `
                <img src="${thumbURL}" alt="${movieName}" onerror="handleImageError(this, '${slug}', '${movieName.replace(/'/g, "\\'")}')">
                <div class="movie-title">${movieName}</div>
            `;
            card.onclick = () => getMovieDetails(slug);
            return card;
        }

        // 1. Load Trang Chủ
        async function fetchHome() {
            try {
                let res = await fetch(API_HOME, { headers: { accept: 'application/json' } });
                let json = await res.json();
                let dataBlock = json.data || json;
                
                homeCategories = {
                    "phimmoi": { title: "Phim Mới Cập Nhật", list: dataBlock.items || dataBlock.phimmoi || [], page: 1 },
                    "phimle": { title: "Phim Lẻ Phổ Biến", list: dataBlock.phimle || [], page: 1 },
                    "phimbo": { title: "Phim Bộ Phổ Biến", list: dataBlock.phimbo || [], page: 1 },
                    "hoathinh": { title: "Hoạt Hình", list: dataBlock.hoathinh || [], page: 1 }
                };

                renderHomeRows();
            } catch (err) {
                console.error(err);
                document.getElementById('home-content').innerHTML = '<div style="text-align:center; color:red; margin-top:40px;">Không thể tải dữ liệu trang chủ.</div>';
            }
        }

        function renderHomeRows() {
            let container = document.getElementById('home-content');
            container.innerHTML = '';

            for (let key in homeCategories) {
                let cat = homeCategories[key];
                if (!cat.list || cat.list.length === 0) continue;

                let sectionDiv = document.createElement('div');
                
                let header = document.createElement('div');
                header.className = 'section-header';
                header.innerHTML = `<div class="section-title">${cat.title}</div>`;
                sectionDiv.appendChild(header);

                let gridRow = document.createElement('div');
                gridRow.className = 'movie-grid-row';
                gridRow.id = `grid-${key}`;
                sectionDiv.appendChild(gridRow);

                let totalPages = Math.ceil(cat.list.length / 8);
                let pagination = document.createElement('div');
                pagination.className = 'pagination-container';
                pagination.innerHTML = `
                    <button class="pagination-btn" ${cat.page <= 1 ? 'disabled' : ''} onclick="changeHomeSectionPage('${key}', -1)">Trang trước</button>
                    <span class="page-indicator">Trang ${cat.page} / ${totalPages > 0 ? totalPages : 1}</span>
                    <button class="pagination-btn" ${cat.page >= totalPages ? 'disabled' : ''} onclick="changeHomeSectionPage('${key}', 1)">Trang sau</button>
                `;
                sectionDiv.appendChild(pagination);

                container.appendChild(sectionDiv);
                updateHomeRowContent(key);
            }
        }

        function updateHomeRowContent(key) {
            let cat = homeCategories[key];
            let gridRow = document.getElementById(`grid-${key}`);
            if (!gridRow) return;

            gridRow.innerHTML = '';
            let start = (cat.page - 1) * 8;
            let end = start + 8;
            let sliceList = cat.list.slice(start, end);

            sliceList.forEach(movie => {
                gridRow.appendChild(createMovieCard(movie));
            });
        }

        function changeHomeSectionPage(key, direction) {
            let cat = homeCategories[key];
            let totalPages = Math.ceil(cat.list.length / 8);
            cat.page += direction;
            if (cat.page < 1) cat.page = 1;
            if (cat.page > totalPages) cat.page = totalPages;

            renderHomeRows();
        }

        // 2. Load Discover
        async function loadDiscoverData() {
            let countries = [
                { name: 'Hàn Quốc', slug: 'han-quoc' },
                { name: 'Trung Quốc', slug: 'trung-quoc' },
                { name: 'Mỹ', slug: 'au-my' },
                { name: 'Nhật Bản', slug: 'nhat-ban' },
                { name: 'Thái Lan', slug: 'thai-lan' }
            ];

            let countryContainer = document.getElementById('country-filters');
            countryContainer.innerHTML = '';
            countries.forEach(c => {
                let chip = document.createElement('div');
                chip.className = `chip ${selectedCountry === c.slug ? 'active' : ''}`;
                chip.innerText = c.name;
                chip.onclick = () => {
                    selectedCountry = c.slug;
                    currentDiscoverPage = 1;
                    loadDiscoverData();
                };
                countryContainer.appendChild(chip);
            });

            try {
                let res = await fetch(API_GENRES);
                let genres = await res.json();
                let genreContainer = document.getElementById('genre-filters');
                genreContainer.innerHTML = '';
                
                let allChip = document.createElement('div');
                allChip.className = `chip ${!selectedGenre ? 'active' : ''}`;
                allChip.innerText = 'Tất cả';
                allChip.onclick = () => { 
                    selectedGenre = ''; 
                    currentDiscoverPage = 1;
                    loadDiscoverData(); 
                };
                genreContainer.appendChild(allChip);

                genres.forEach(g => {
                    let chip = document.createElement('div');
                    chip.className = `chip ${selectedGenre === g.slug ? 'active' : ''}`;
                    chip.innerText = g.name;
                    chip.onclick = () => {
                        selectedGenre = g.slug;
                        currentDiscoverPage = 1;
                        loadDiscoverData();
                    };
                    genreContainer.appendChild(chip);
                });
            } catch(e) { console.error(e); }

            fetchFilteredMovies();
        }

        async function fetchFilteredMovies() {
            let grid = document.getElementById('discover-grid');
            grid.innerHTML = '<div style="color:var(--text-muted); grid-column: 1/-1; text-align:center; padding:20px;">Đang tải...</div>';
            
            let url = `https://phimapi.com/v1/api/quoc-gia/${selectedCountry}?page=${currentDiscoverPage}`;
            if (selectedGenre) {
                url = `https://phimapi.com/v1/api/the-loai/${selectedGenre}?page=${currentDiscoverPage}`;
            }

            try {
                let res = await fetch(url);
                let json = await res.json();
                let items = json.data?.items || json.items || [];
                
                grid.innerHTML = '';
                if (items.length === 0) {
                    grid.innerHTML = '<div style="color:var(--text-muted); grid-column: 1/-1; text-align:center;">Không tìm thấy phim phù hợp.</div>';
                    return;
                }
                items.forEach(movie => grid.appendChild(createMovieCard(movie)));

                document.getElementById('page-indicator').innerText = `Trang ${currentDiscoverPage}`;
                document.getElementById('prev-page-btn').disabled = currentDiscoverPage <= 1;
            } catch (err) {
                grid.innerHTML = '<div style="color:red; grid-column: 1/-1; text-align:center;">Lỗi tải dữ liệu.</div>';
            }
        }

        function changeDiscoverPage(direction) {
            currentDiscoverPage += direction;
            if (currentDiscoverPage < 1) currentDiscoverPage = 1;
            fetchFilteredMovies();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 3. Tìm kiếm phim
        function handleSearchKey(event) {
            if (event.key === 'Enter') {
                let keyword = document.getElementById('search-input').value.trim();
                if (keyword) performSearch(keyword);
            }
        }

        async function performSearch(keyword) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.getElementById('view-search').classList.add('active');
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

            let grid = document.getElementById('search-grid');
            document.getElementById('search-heading').innerText = `Kết quả tìm kiếm: "${keyword}"`;
            grid.innerHTML = '<div style="color:var(--text-muted); grid-column: 1/-1; text-align:center; padding:20px;">Đang tìm kiếm...</div>';

            try {
                let res = await fetch(`https://phimapi.com/v1/api/tim-kiem?keyword=${encodeURIComponent(keyword)}&limit=24`);
                let json = await res.json();
                let items = json.data?.items || json.items || [];

                grid.innerHTML = '';
                if (items.length === 0) {
                    grid.innerHTML = '<div style="color:var(--text-muted); grid-column: 1/-1; text-align:center;">Không tìm thấy bộ phim nào.</div>';
                    return;
                }
                items.forEach(movie => grid.appendChild(createMovieCard(movie)));
            } catch (err) {
                grid.innerHTML = '<div style="color:red; grid-column: 1/-1; text-align:center;">Lỗi kết nối tìm kiếm.</div>';
            }
        }

        // 4. Xem chi tiết & Phát video
        async function getMovieDetails(slug) {
            try {
                let res = await fetch(`https://phimapi.com/phim/${slug}`);
                let data = await res.json();
                let episodes = data.episodes;
                if (episodes && episodes.length > 0) {
                    let serverData = episodes[0].server_data;
                    if (serverData && serverData.length > 0) {
                        let playUrl = serverData[0].link_m3u8;
                        if (playUrl) {
                            playVideo(playUrl);
                            return;
                        }
                    }
                }
                alert('Phim này hiện chưa có link phát video!');
            } catch (error) {
                alert('Không thể lấy chi tiết phim!');
            }
        }

        function playVideo(url) {
            const container = document.getElementById('player-container');
            const video = document.getElementById('video-player');
            container.style.display = 'flex';

            if (url.includes('.m3u8')) {
                if (Hls.isSupported()) {
                    if (window.hlsInstance) window.hlsInstance.destroy();
                    const hls = new Hls();
                    window.hlsInstance = hls;
                    hls.loadSource(url);
                    hls.attachMedia(video);
                    hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(e => {}));
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = url;
                    video.play();
                }
            } else {
                video.src = url;
                video.play().catch(e => {});
            }
        }

        function closePlayer() {
            const container = document.getElementById('player-container');
            const video = document.getElementById('video-player');
            video.pause();
            video.src = '';
            if (window.hlsInstance) window.hlsInstance.destroy();
            container.style.display = 'none';
        }

        // Khởi chạy ban đầu
        fetchHome();
    </script>
</body>
</html>
