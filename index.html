<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stremio Web</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --card-bg: #181818;
            --accent-color: #7b2cbf;
            --accent-hover: #9d4edd;
            --text-main: #ffffff;
            --text-muted: #888888;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0 0 80px 0;
            -webkit-user-select: none;
        }
        /* Search Bar Header */
        .header-container {
            padding: 20px 16px 10px 16px;
            display: flex;
            justify-content: center;
            background: linear-gradient(to bottom, #000 0%, var(--bg-color) 100%);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .search-box {
            position: relative;
            width: 100%;
            max-width: 600px;
        }
        .search-box input {
            width: 100%;
            padding: 12px 20px;
            background-color: #1a1a1a;
            border: 1px solid #333;
            border-radius: 30px;
            color: #fff;
            font-size: 15px;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.2s;
            text-align: center;
        }
        .search-box input:focus {
            border-color: var(--accent-color);
            text-align: left;
            padding-left: 20px;
        }

        /* Views Container */
        .view-section {
            display: none;
            padding: 10px 16px;
        }
        .view-section.active {
            display: block;
        }

        /* Movie Card */
        .movie-card {
            background-color: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 2px solid transparent;
            position: relative;
        }
        .movie-card:focus, .movie-card:hover {
            transform: scale(1.05);
            border-color: var(--accent-color);
            outline: none;
            box-shadow: 0 4px 20px rgba(123, 44, 191, 0.4);
        }
        .movie-card img {
            width: 100%;
            height: 190px;
            object-fit: cover;
            background-color: #222;
            display: block;
        }
        .movie-title {
            padding: 8px;
            font-size: 12px;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #ddd;
        }

        /* Grid for Discover/Search/History */
        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 12px;
            margin-top: 10px;
        }

        /* Pagination Style */
        .pagination-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin: 20px 0 25px 0;
        }
        .pagination-btn {
            padding: 6px 14px;
            background-color: var(--accent-color);
            color: #fff;
            border: none;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            font-size: 13px;
            transition: background 0.2s;
        }
        .pagination-btn:hover {
            background-color: var(--accent-hover);
        }
        .pagination-btn:disabled {
            background-color: #222;
            color: #555;
            cursor: not-allowed;
        }
        .page-indicator {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: bold;
        }

        /* Filter Chips */
        .filter-container {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            margin-bottom: 15px;
            scrollbar-width: none;
        }
        .filter-container::-webkit-scrollbar { display: none; }
        .chip {
            padding: 6px 14px;
            background-color: #1a1a1a;
            border: 1px solid #333;
            border-radius: 20px;
            font-size: 13px;
            color: #aaa;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .chip.active, .chip:hover {
            background-color: var(--accent-color);
            color: #fff;
            border-color: var(--accent-color);
        }

        /* Bottom Navigation Bar */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 65px;
            background-color: #121212;
            border-top: 1px solid #222;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
        }
        .nav-item {
            background: none;
            border: none;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 11px;
            cursor: pointer;
            gap: 4px;
            transition: color 0.2s;
        }
        .nav-item svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }
        .nav-item.active {
            color: var(--accent-color);
        }

        /* Video Player Modal */
        #player-container {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.98);
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 2000;
        }
        video {
            width: 85%;
            height: 85%;
            background: #000;
        }
        .close-btn {
            margin-top: 15px;
            padding: 10px 24px;
            background: var(--accent-color);
            color: #fff;
            border: none;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            font-size: 15px;
        }
    </style>
</head>
<body>

    <!-- Header Search Bar -->
    <div class="header-container">
        <div class="search-box">
            <input type="text" id="search-input" placeholder="Tìm kiếm phim, diễn viên..." onkeypress="handleSearchKey(event)">
        </div>
    </div>

    <!-- TAB 1: DISCOVER (Mặc định khi mở web) -->
    <div id="view-discover" class="view-section active">
        <div class="section-title" style="margin-bottom: 8px;">Quốc gia</div>
        <div id="country-filters" class="filter-container"></div>

        <div class="section-title" style="margin-bottom: 8px;">Thể loại</div>
        <div id="genre-filters" class="filter-container"></div>

        <div id="discover-grid" class="movie-grid"></div>

        <div class="pagination-container">
            <button class="pagination-btn" id="prev-page-btn" onclick="changeDiscoverPage(-1)">Trang trước</button>
            <span class="page-indicator" id="page-indicator">Trang 1</span>
            <button class="pagination-btn" id="next-page-btn" onclick="changeDiscoverPage(1)">Trang sau</button>
        </div>
    </div>

    <!-- TAB 2: WATCHLIST / LỊCH SỬ ĐANG XEM -->
    <div id="view-history" class="view-section">
        <div class="section-title" style="margin-bottom: 12px;">Phim đang xem / Lịch sử</div>
        <div id="history-grid" class="movie-grid"></div>
    </div>

    <!-- TAB 3: SEARCH RESULTS VIEW -->
    <div id="view-search" class="view-section">
        <div class="section-title" id="search-heading" style="margin-bottom: 12px;">Kết quả tìm kiếm</div>
        <div id="search-grid" class="movie-grid"></div>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="bottom-nav">
        <button class="nav-item active" onclick="switchTab('discover', this)">
            <svg viewBox="0 0 24 24"><path d="M12 10.9c-.61 0-1.1.49-1.1 1.1s.49 1.1 1.1 1.1c.61 0 1.1-.49 1.1-1.1s-.49-1.1-1.1-1.1zM12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm2.19 12.19L6 18l3.81-8.19L18 6l-3.81 8.19z"/></svg>
            Khám phá
        </button>
        <button class="nav-item" onclick="switchTab('history', this)">
            <svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.58 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
            Đang xem
        </button>
    </div>

    <!-- Video Player Modal -->
    <div id="player-container">
        <video id="video-player" controls autoplay></video>
        <button class="close-btn" onclick="closePlayer()">Đóng phát</button>
    </div>

    <script>
        const API_GENRES = 'https://phimapi.com/the-loai';
        
        let selectedCountry = 'han-quoc';
        let selectedGenre = '';
        let currentDiscoverPage = 1;

        // Chuyển tab giao diện
        function switchTab(tabName, btnElement) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

            if (tabName === 'discover') {
                document.getElementById('view-discover').classList.add('active');
            } else if (tabName === 'history') {
                document.getElementById('view-history').classList.add('active');
                renderHistoryMovies();
            } else if (tabName === 'search') {
                document.getElementById('view-search').classList.add('active');
            }

            if (btnElement) btnElement.classList.add('active');
        }

        function getImageUrl(path) {
            if (!path) return '';
            if (path.startsWith('http://') || path.startsWith('https://')) {
                return path.replace('img.phimapi.com', 'phimimg.com').replace('phimapi.com/upload', 'phimimg.com/upload');
            }
            return `https://phimimg.com/${path.startsWith('/') ? path.slice(1) : path}`;
        }

        function handleImageError(imgElement, slug, movieName) {
            imgElement.onerror = null; 
            if (slug) {
                imgElement.src = `https://img.phimapi.com/thumb/${slug}.jpg`;
                imgElement.onerror = function() {
                    this.src = `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="130" height="190" viewBox="0 0 130 190"><rect width="130" height="190" fill="%231a1a1a"/><text x="50%" y="50%" fill="%23aaa" font-size="11" font-family="Arial" text-anchor="middle" width="120"><tspan x="50%" dy="-10">${encodeURIComponent(movieName || 'No Image')}</tspan></text></svg>`;
                };
            }
        }

        function createMovieCard(movie) {
            let card = document.createElement('div');
            card.className = 'movie-card';
            card.tabIndex = 0;
            
            let rawImg = movie.poster_url || movie.thumb_url || '';
            let thumbURL = getImageUrl(rawImg);
            let slug = movie.slug || '';
            let movieName = movie.name || '';

            card.innerHTML = `
                <img src="${thumbURL}" alt="${movieName}" onerror="handleImageError(this, '${slug}', '${movieName.replace(/'/g, "\\'")}')">
                <div class="movie-title">${movieName}</div>
            `;
            card.onclick = () => getMovieDetails(slug, movie);
            return card;
        }

        // --- LƯU VÀ HIỂN THỊ LỊCH SỬ PHIM ĐANG XEM ---
        function saveToHistory(movie) {
            if (!movie || !movie.slug) return;
            let history = JSON.parse(localStorage.getItem('stremio_history') || '[]');
            // Xóa phim cũ nếu đã có để đưa lên đầu danh sách
            history = history.filter(item => item.slug !== movie.slug);
            history.unshift(movie);
            // Giới hạn lưu tối đa 20 phim gần nhất
            if (history.length > 20) history.pop();
            localStorage.setItem('stremio_history', JSON.stringify(history));
        }

        function renderHistoryMovies() {
            let grid = document.getElementById('history-grid');
            let history = JSON.parse(localStorage.getItem('stremio_history') || '[]');
            
            grid.innerHTML = '';
            if (history.length === 0) {
                grid.innerHTML = '<div style="color:var(--text-muted); grid-column: 1/-1; text-align:center; padding:40px;">Chưa có phim nào đang xem dở. Hãy bấm xem một bộ phim bất kỳ nhé!</div>';
                return;
            }
            history.forEach(movie => grid.appendChild(createMovieCard(movie)));
        }

        // --- LOAD DISCOVER (QUỐC GIA & THỂ LOẠI) ---
        async function loadDiscoverData() {
            let countries = [
                { name: 'Hàn Quốc', slug: 'han-quoc' },
                { name: 'Trung Quốc', slug: 'trung-quoc' },
                { name: 'Mỹ', slug: 'au-my' },
                { name: 'Nhật Bản', slug: 'nhat-ban' },
                { name: 'Thái Lan', slug: 'thai-lan' }
            ];

            let countryContainer = document.getElementById('country-filters');
            countryContainer.innerHTML = '';
            countries.forEach(c => {
                let chip = document.createElement('div');
                chip.className = `chip ${selectedCountry === c.slug ? 'active' : ''}`;
                chip.innerText = c.name;
                chip.onclick = () => {
                    selectedCountry = c.slug;
                    currentDiscoverPage = 1;
                    loadDiscoverData();
                };
                countryContainer.appendChild(chip);
            });

            try {
                let res = await fetch(API_GENRES);
                let json = await res.json();
                let genres = Array.isArray(json) ? json : (json.data || json.items || []);
                
                let genreContainer = document.getElementById('genre-filters');
                genreContainer.innerHTML = '';
                
                let allChip = document.createElement('div');
                allChip.className = `chip ${!selectedGenre ? 'active' : ''}`;
                allChip.innerText = 'Tất cả';
                allChip.onclick = () => { 
                    selectedGenre = ''; 
                    currentDiscoverPage = 1;
                    loadDiscoverData(); 
                };
                genreContainer.appendChild(allChip);

                genres.forEach(g => {
                    let chip = document.createElement('div');
                    chip.className = `chip ${selectedGenre === g.slug ? 'active' : ''}`;
                    chip.innerText = g.name;
                    chip.onclick = () => {
                        selectedGenre = g.slug;
                        currentDiscoverPage = 1;
                        loadDiscoverData();
                    };
                    genreContainer.appendChild(chip);
                });
            } catch(e) { console.error("Lỗi tải thể loại:", e); }

            fetchFilteredMovies();
        }

        async function fetchFilteredMovies() {
            let grid = document.getElementById('discover-grid');
            grid.innerHTML = '<div style="color:var(--text-muted); grid-column: 1/-1; text-align:center; padding:20px;">Đang tải...</div>';
            
            let url = `https://phimapi.com/v1/api/quoc-gia/${selectedCountry}?page=${currentDiscoverPage}`;
            if (selectedGenre) {
                url = `https://phimapi.com/v1/api/the-loai/${selectedGenre}?page=${currentDiscoverPage}`;
            }

            try {
                let res = await fetch(url);
                let json = await res.json();
                let items = json.data?.items || json.items || [];
                
                grid.innerHTML = '';
                if (items.length === 0) {
                    grid.innerHTML = '<div style="color:var(--text-muted); grid-column: 1/-1; text-align:center;">Không tìm thấy phim phù hợp.</div>';
                    return;
                }
                items.forEach(movie => grid.appendChild(createMovieCard(movie)));

                document.getElementById('page-indicator').innerText = `Trang ${currentDiscoverPage}`;
                document.getElementById('prev-page-btn').disabled = currentDiscoverPage <= 1;
            } catch (err) {
                grid.innerHTML = '<div style="color:red; grid-column: 1/-1; text-align:center;">Lỗi tải dữ liệu.</div>';
            }
        }

        function changeDiscoverPage(direction) {
            currentDiscoverPage += direction;
            if (currentDiscoverPage < 1) currentDiscoverPage = 1;
            fetchFilteredMovies();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // --- TÌM KIẾM PHIM ---
        function handleSearchKey(event) {
            if (event.key === 'Enter') {
                let keyword = document.getElementById('search-input').value.trim();
                if (keyword) performSearch(keyword);
            }
        }

        async function performSearch(keyword) {
            switchTab('search', null);
            let grid = document.getElementById('search-grid');
            document.getElementById('search-heading').innerText = `Kết quả tìm kiếm: "${keyword}"`;
            grid.innerHTML = '<div style="color:var(--text-muted); grid-column: 1/-1; text-align:center; padding:20px;">Đang tìm kiếm...</div>';

            try {
                let res = await fetch(`https://phimapi.com/v1/api/tim-kiem?keyword=${encodeURIComponent(keyword)}&limit=24`);
                let json = await res.json();
                let items = json.data?.items || json.items || [];

                grid.innerHTML = '';
                if (items.length === 0) {
                    grid.innerHTML = '<div style="color:var(--text-muted); grid-column: 1/-1; text-align:center;">Không tìm thấy bộ phim nào.</div>';
                    return;
                }
                items.forEach(movie => grid.appendChild(createMovieCard(movie)));
            } catch (err) {
                grid.innerHTML = '<div style="color:red; grid-column: 1/-1; text-align:center;">Lỗi kết nối tìm kiếm.</div>';
            }
        }

        // --- XEM CHI TIẾT & PHÁT VIDEO ---
        async function getMovieDetails(slug, movieData) {
            try {
                let res = await fetch(`https://phimapi.com/phim/${slug}`);
                let data = await res.json();
                
                // Nếu api chi tiết trả về đủ thông tin, tiến hành lưu lịch sử
                let fullMovieInfo = {
                    slug: slug,
                    name: data.movie?.name || movieData.name,
                    poster_url: data.movie?.poster_url || data.movie?.thumb_url || movieData.poster_url || movieData.thumb_url
                };
                saveToHistory(fullMovieInfo);

                let episodes = data.episodes;
                if (episodes && episodes.length > 0) {
                    let serverData = episodes[0].server_data;
                    if (serverData && serverData.length > 0) {
                        let playUrl = serverData[0].link_m3u8;
                        if (playUrl) {
                            playVideo(playUrl);
                            return;
                        }
                    }
                }
                alert('Phim này hiện chưa có link phát video!');
            } catch (error) {
                alert('Không thể lấy chi tiết phim!');
            }
        }

        function playVideo(url) {
            const container = document.getElementById('player-container');
            const video = document.getElementById('video-player');
            container.style.display = 'flex';

            if (url.includes('.m3u8')) {
                if (Hls.isSupported()) {
                    if (window.hlsInstance) window.hlsInstance.destroy();
                    const hls = new Hls();
                    window.hlsInstance = hls;
                    hls.loadSource(url);
                    hls.attachMedia(video);
                    hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(e => {}));
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = url;
                    video.play();
                }
            } else {
                video.src = url;
                video.play().catch(e => {});
            }
        }

        function closePlayer() {
            const container = document.getElementById('player-container');
            const video = document.getElementById('video-player');
            video.pause();
            video.src = '';
            if (window.hlsInstance) window.hlsInstance.destroy();
            container.style.display = 'none';
        }

        // Khởi chạy giao diện Khám phá mặc định khi mở web
        loadDiscoverData();
    </script>
</body>
</html>
