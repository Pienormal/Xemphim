<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kho Phim KKPhim v5.2</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #ff9800;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 25px;
            font-size: 14px;
        }
        .section-title {
            color: #ff9800;
            margin-top: 30px;
            margin-bottom: 10px;
            border-left: 4px solid #ff9800;
            padding-left: 10px;
            font-size: 18px;
        }
        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .movie-card {
            background-color: #1e1e1e;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 2px solid transparent;
        }
        .movie-card:focus, .movie-card:hover {
            transform: scale(1.05);
            border-color: #ff9800;
            outline: none;
            box-shadow: 0 0 15px rgba(255, 152, 0, 0.6);
        }
        .movie-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }
        .movie-title {
            padding: 10px;
            font-size: 13px;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        #player-container {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 1000;
        }
        video {
            width: 80%;
            height: 80%;
            background: #000;
        }
        .close-btn {
            margin-top: 15px;
            padding: 10px 20px;
            background: #ff9800;
            color: #000;
            border: none;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <h1>Kho Phim KKPhim</h1>
    <div class="subtitle">Trang chủ tổng hợp v1</div>
    
    <div id="content-container">
        <div style="text-align: center; color: #aaa; margin-top: 50px;">Đang tải kho phim chuẩn v1...</div>
    </div>

    <div id="player-container">
        <video id="video-player" controls autoplay></video>
        <button class="close-btn" onclick="closePlayer()">Đóng (Quay lại)</button>
    </div>

    <script>
        const homeAPI = 'https://phimapi.com/v1/api/home';

        async function fetchHomeData() {
            try {
                let res = await fetch(homeAPI, {
                    headers: { accept: 'application/json' }
                });
                let json = await res.json();
                
                console.log("Dữ liệu trang chủ v1:", json);
                
                // Dữ liệu v1 trả về thường nằm trong json.data hoặc json
                let dataBlock = json.data || json;
                let container = document.getElementById('content-container');
                container.innerHTML = '';

                // Các khối thường có trong api/home: phimmoi (hoặc items), phimle, phimbo, hoathinh,...
                // Tùy theo cấu trúc trả về, ta duyệt qua các nhóm để render ra giao diện
                renderSection(container, "Phim Mới Cập Nhật", dataBlock.items || dataBlock.phimmoi);
                renderSection(container, "Phim Lẻ", dataBlock.phimle);
                renderSection(container, "Phim Bộ", dataBlock.phimbo);
                renderSection(container, "Hoạt Hình", dataBlock.hoathinh);

                // Focus vào thẻ đầu tiên để hỗ trợ điều khiển bằng remote Tivi
                document.querySelector('.movie-card')?.focus();

            } catch (error) {
                console.error('Lỗi tải dữ liệu trang chủ:', error);
                document.getElementById('content-container').innerHTML = '<div style="text-align: center; color: red;">Không thể kết nối tới KKPhim API v1.</div>';
            }
        }

        function renderSection(parentContainer, titleText, movieList) {
            if (!movieList || movieList.length === 0) return;

            let title = document.createElement('div');
            title.className = 'section-title';
            title.innerText = titleText;
            parentContainer.appendChild(title);

            let grid = document.createElement('div');
            grid.className = 'movie-grid';

            movieList.forEach((movie, index) => {
                let card = document.createElement('div');
                card.className = 'movie-card';
                card.tabIndex = 0;

                let thumbURL = movie.thumb_url || movie.poster_url;
                if (thumbURL && !thumbURL.startsWith('http')) {
                    thumbURL = `https://img.phimapi.com/${thumbURL}`;
                }

                card.innerHTML = `
                    <img src="${thumbURL}" alt="${movie.name}">
                    <div class="movie-title">${movie.name}</div>
                `;

                card.onclick = () => getMovieDetails(movie.slug);
                grid.appendChild(card);
            });

            parentContainer.appendChild(grid);
        }

        async function getMovieDetails(slug) {
            try {
                let res = await fetch(`https://phimapi.com/phim/${slug}`);
                let data = await res.json();
                
                let episodes = data.episodes;
                if (episodes && episodes.length > 0) {
                    let serverData = episodes[0].server_data;
                    if (serverData && serverData.length > 0) {
                        let playUrl = serverData[0].link_m3u8;
                        if (playUrl) {
                            playVideo(playUrl);
                            return;
                        }
                    }
                }
                alert('Phim này chưa có link phát video!');
            } catch (error) {
                console.error(error);
                alert('Không thể lấy chi tiết phim!');
            }
        }

        function playVideo(url) {
            const container = document.getElementById('player-container');
            const video = document.getElementById('video-player');
            container.style.display = 'flex';

            if (url.includes('.m3u8')) {
                if (Hls.isSupported()) {
                    if (window.hlsInstance) window.hlsInstance.destroy();
                    const hls = new Hls();
                    window.hlsInstance = hls;
                    hls.loadSource(url);
                    hls.attachMedia(video);
                    hls.on(Hls.Events.MANIFEST_PARSED, () => {
                        video.play().catch(e => console.log("Cần bấm play thủ công"));
                    });
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = url;
                    video.play();
                }
            } else {
                video.src = url;
                video.play().catch(e => console.log("Cần bấm play thủ công"));
            }
        }

        function closePlayer() {
            const container = document.getElementById('player-container');
            const video = document.getElementById('video-player');
            video.pause();
            video.src = '';
            if (window.hlsInstance) window.hlsInstance.destroy();
            container.style.display = 'none';
        }

        fetchHomeData();
    </script>
</body>
</html>
