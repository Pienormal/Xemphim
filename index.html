<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --card-bg: #181818;
            --accent-color: #7b2cbf;
            --accent-hover: #9d4edd;
            --text-main: #ffffff;
            --text-muted: #888888;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0 0 50px 0;
            -webkit-user-select: none;
        }

        /* Header Search Bar */
        .header-container {
            padding: 20px 24px 10px 24px;
            display: flex;
            justify-content: center;
            background: linear-gradient(to bottom, #000 0%, var(--bg-color) 100%);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .search-box {
            position: relative;
            width: 100%;
            max-width: 600px;
        }
        .search-box input {
            width: 100%;
            padding: 12px 20px;
            background-color: #1a1a1a;
            border: 1px solid #333;
            border-radius: 30px;
            color: #fff;
            font-size: 15px;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.2s;
            text-align: center;
        }
        .search-box input:focus {
            border-color: var(--accent-color);
            text-align: left;
            padding-left: 20px;
        }

        /* Main Content Container */
        .main-container {
            padding: 10px 24px;
        }

        /* Section Titles & Rows */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 24px 0 12px 0;
        }
        .section-title {
            color: var(--text-main);
            font-size: 18px;
            font-weight: bold;
        }
        .movie-row {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 8px;
            scrollbar-width: none;
        }
        .movie-row::-webkit-scrollbar { display: none; }

        @media (max-width: 1400px) {
            .movie-row { grid-template-columns: repeat(6, 1fr); }
        }
        @media (max-width: 1000px) {
            .movie-row { grid-template-columns: repeat(4, 1fr); }
        }
        @media (max-width: 600px) {
            .movie-row { grid-template-columns: repeat(2, 1fr); }
        }

        /* Movie Card */
        .movie-card {
            background-color: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
            border: 2px solid transparent;
            flex: 0 0 auto;
            position: relative;
        }
        .movie-card:focus, .movie-card:hover {
            transform: scale(1.06);
            border-color: var(--accent-color);
            outline: none;
            box-shadow: 0 6px 25px rgba(123, 44, 191, 0.5);
        }
        .movie-card img {
            width: 100%;
            height: 190px;
            object-fit: cover;
            background-color: #222;
            display: block;
        }
        .movie-title {
            padding: 8px;
            font-size: 12px;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #ddd;
        }

        /* Nút xóa khỏi lịch sử */
        .remove-history-btn {
            position: absolute;
            top: 6px;
            right: 6px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            width: 26px;
            height: 26px;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
        }
        .remove-history-btn:hover {
            background: #ff4d4d;
            border-color: #ff4d4d;
        }

        /* Filter Chips Bar */
        .filter-container {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            margin-bottom: 15px;
            scrollbar-width: none;
        }
        .filter-container::-webkit-scrollbar { display: none; }
        .chip {
            padding: 6px 14px;
            background-color: #1a1a1a;
            border: 1px solid #333;
            border-radius: 20px;
            font-size: 13px;
            color: #aaa;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .chip.active, .chip:hover {
            background-color: var(--accent-color);
            color: #fff;
            border-color: var(--accent-color);
        }

        /* Pagination Controls */
        .pagination-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 25px;
        }
        .page-btn {
            padding: 10px 24px;
            background-color: #1a1a1a;
            color: #fff;
            border: 1px solid #333;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .page-btn:focus, .page-btn:hover {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
            outline: none;
            transform: scale(1.05);
        }
        .page-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }
        .page-info {
            color: var(--text-muted);
            font-size: 14px;
        }

        /* Video Player Modal */
        #player-container {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.98);
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 2000;
        }
        video {
            width: 100%;
            height: 100%;
            background: #000;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <!-- Header Search Bar -->
    <div class="header-container">
        <div class="search-box">
            <input type="text" id="search-input" placeholder="Tìm kiếm phim, diễn viên..." onkeypress="handleSearchKey(event)">
        </div>
    </div>

    <!-- Main Dynamic Content Container -->
    <div class="main-container" id="main-content">
        <!-- Lịch sử / Phim đang xem -->
        <div id="history-section" style="display: none;">
            <div class="section-header">
                <div class="section-title">⭐ Tiếp tục xem (Lịch sử)</div>
            </div>
            <div class="movie-row" id="history-row"></div>
        </div>

        <!-- Bộ lọc Quốc gia -->
        <div class="section-header" style="margin-top: 10px;">
            <div class="section-title">Khám phá theo Quốc gia</div>
        </div>
        <div id="country-filters" class="filter-container"></div>

        <!-- Bộ lọc Thể loại -->
        <div class="section-header">
            <div class="section-title">Khám phá theo Thể loại</div>
        </div>
        <div id="genre-filters" class="filter-container"></div>

        <!-- Danh sách kết quả -->
        <div class="section-header">
            <div class="section-title" id="results-title">Danh sách phim</div>
        </div>
        <div class="movie-row" id="results-row" style="grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));"></div>

        <!-- Nút Phân trang -->
        <div class="pagination-container" id="pagination-controls">
            <button class="page-btn" id="prev-btn" onclick="changePage(-1)">⬅ Trang trước</button>
            <span class="page-info" id="page-info">Trang 1</span>
            <button class="page-btn" id="next-btn" onclick="changePage(1)">Trang sau ➡</button>
        </div>
    </div>

    <!-- Video Player Modal -->
    <div id="player-container">
        <video id="video-player" controls autoplay playsinline></video>
    </div>

    <script>
        let currentFilterType = 'the-loai'; 
        let currentFilterSlug = 'hanh-dong';
        let currentPage = 1;
        let totalPages = 1;

        function getImageUrl(path) {
            if (!path) return '';
            if (path.startsWith('http://') || path.startsWith('https://')) {
                return path.replace('img.phimapi.com', 'phimimg.com').replace('phimapi.com/upload', 'phimimg.com/upload');
            }
            return `https://phimimg.com/${path.startsWith('/') ? path.slice(1) : path}`;
        }

        function handleImageError(imgElement, slug, movieName) {
            imgElement.onerror = null; 
            if (slug) {
                imgElement.src = `https://img.phimapi.com/thumb/${slug}.jpg`;
                imgElement.onerror = function() {
                    this.src = `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="130" height="190" viewBox="0 0 130 190"><rect width="130" height="190" fill="%231a1a1a"/><text x="50%" y="50%" fill="%23aaa" font-size="11" font-family="Arial" text-anchor="middle" width="120"><tspan x="50%" dy="-10">${encodeURIComponent(movieName || 'No Image')}</tspan></text></svg>`;
                };
            }
        }

        function createMovieCard(movie, isHistory = false) {
            let card = document.createElement('div');
            card.className = 'movie-card';
            card.tabIndex = 0;
            
            let rawImg = movie.poster_url || movie.thumb_url || '';
            let thumbURL = getImageUrl(rawImg);
            let slug = movie.slug || '';
            let movieName = movie.name || '';

            let html = `
                <img src="${thumbURL}" alt="${movieName}" onerror="handleImageError(this, '${slug}', '${movieName.replace(/'/g, "\\'")}')">
                <div class="movie-title">${movieName}</div>
            `;

            if (isHistory) {
                html += `<button class="remove-history-btn" title="Xóa khỏi lịch sử" onclick="event.stopPropagation(); removeFromHistory('${slug}')">×</button>`;
            }

            card.innerHTML = html;
            card.onclick = () => getMovieDetails(slug, movie);
            return card;
        }

        function saveToHistory(movie) {
            if (!movie || !movie.slug) return;
            let history = JSON.parse(localStorage.getItem('stremio_history') || '[]');
            history = history.filter(item => item.slug !== movie.slug);
            history.unshift(movie);
            if (history.length > 15) history.pop();
            localStorage.setItem('stremio_history', JSON.stringify(history));
            renderHistorySection();
        }

        function removeFromHistory(slug) {
            let history = JSON.parse(localStorage.getItem('stremio_history') || '[]');
            history = history.filter(item => item.slug !== slug);
            localStorage.setItem('stremio_history', JSON.stringify(history));
            renderHistorySection();
        }

        function renderHistorySection() {
            let historySection = document.getElementById('history-section');
            let historyRow = document.getElementById('history-row');
            let history = JSON.parse(localStorage.getItem('stremio_history') || '[]');

            if (history.length === 0) {
                historySection.style.display = 'none';
                return;
            }

            historySection.style.display = 'block';
            historyRow.innerHTML = '';
            history.forEach(movie => historyRow.appendChild(createMovieCard(movie, true)));
        }

        function initApp() {
            try {
                renderHistorySection();

                let countries = [
                    { name: 'Hàn Quốc', slug: 'han-quoc' },
                    { name: 'Trung Quốc', slug: 'trung-quoc' },
                    { name: 'Mỹ', slug: 'au-my' },
                    { name: 'Nhật Bản', slug: 'nhat-ban' },
                    { name: 'Thái Lan', slug: 'thai-lan' }
                ];

                let countryContainer = document.getElementById('country-filters');
                if (countryContainer) {
                    countryContainer.innerHTML = '';
                    countries.forEach(c => {
                        let chip = document.createElement('div');
                        chip.className = `chip ${currentFilterType === 'quoc-gia' && currentFilterSlug === c.slug ? 'active' : ''}`;
                        chip.innerText = c.name;
                        chip.onclick = () => {
                            currentFilterType = 'quoc-gia';
                            currentFilterSlug = c.slug;
                            currentPage = 1;
                            highlightActiveChips();
                            fetchFilteredMovies();
                        };
                        countryContainer.appendChild(chip);
                    });
                }

                let genres = [
                    { name: 'Hành Động', slug: 'hanh-dong' },
                    { name: 'Tình Cảm', slug: 'tinh-cam' },
                    { name: 'Hài Hước', slug: 'hai-huoc' },
                    { name: 'Kinh Dị', slug: 'kinh-di' },
                    { name: 'Viễn Tưởng', slug: 'vien-tuong' },
                    { name: 'Hoạt Hình', slug: 'hoat-hinh' },
                    { name: 'Võ Thuật', slug: 'vo-thuat' },
                    { name: 'Tâm Lý', slug: 'tam-ly' }
                ];

                let genreContainer = document.getElementById('genre-filters');
                if (genreContainer) {
                    genreContainer.innerHTML = '';
                    genres.forEach(g => {
                        let chip = document.createElement('div');
                        chip.className = `chip ${currentFilterType === 'the-loai' && currentFilterSlug === g.slug ? 'active' : ''}`;
                        chip.innerText = g.name;
                        chip.onclick = () => {
                            currentFilterType = 'the-loai';
                            currentFilterSlug = g.slug;
                            currentPage = 1;
                            highlightActiveChips();
                            fetchFilteredMovies();
                        };
                        genreContainer.appendChild(chip);
                    });
                }

                highlightActiveChips();
                fetchFilteredMovies();
            } catch (e) {
                console.error("Init Error: ", e);
            }
        }

        function highlightActiveChips() {
            document.querySelectorAll('.chip').forEach(chip => {
                let matches = (chip.innerText === getSlugName(currentFilterSlug));
                if (matches) {
                    chip.classList.add('active');
                } else {
                    chip.classList.remove('active');
                }
            });
        }

        function getSlugName(slug) {
            const map = {
                'han-quoc': 'Hàn Quốc', 'trung-quoc': 'Trung Quốc', 'au-my': 'Mỹ', 'nhat-ban': 'Nhật Bản', 'thai-lan': 'Thái Lan',
                'hanh-dong': 'Hành Động', 'tinh-cam': 'Tình Cảm', 'hai-huoc': 'Hài Hước', 'kinh-di': 'Kinh Dị', 
                'vien-tuong': 'Viễn Tưởng', 'hoat-hinh': 'Hoạt Hình', 'vo-thuat': 'Võ Thuật', 'tam-ly': 'Tâm Lý'
            };
            return map[slug] || '';
        }

        async function fetchFilteredMovies() {
            let row = document.getElementById('results-row');
            document.getElementById('results-title').innerText = "Danh sách phim";
            row.innerHTML = '<div style="color:var(--text-muted); padding:20px;">Đang tải dữ liệu từ máy chủ...</div>';
            
            let url = `https://phimapi.com/v1/api/${currentFilterType}/${currentFilterSlug}?page=${currentPage}`;

            try {
                let res = await fetch(url);
                if (!res.ok) throw new Error('Network response was not ok');
                let json = await res.json();
                
                let items = json.data?.items || json.items || json.data || [];
                if (!Array.isArray(items)) items = [];
                
                if (json.data?.params?.pagination) {
                    let totalItems = json.data.params.pagination.totalItems || 0;
                    let limit = json.data.params.pagination.totalItemsPerPage || 24;
                    totalPages = Math.ceil(totalItems / limit) || 1;
                } else {
                    totalPages = items.length > 0 ? currentPage + 1 : currentPage; 
                }

                row.innerHTML = '';
                if (items.length === 0) {
                    row.innerHTML = '<div style="color:var(--text-muted); padding:20px;">Không tìm thấy phim phù hợp.</div>';
                    document.getElementById('pagination-controls').style.display = 'none';
                    return;
                }
                
                items.forEach(movie => row.appendChild(createMovieCard(movie, false)));
                updatePaginationUI();
            } catch (err) {
                row.innerHTML = `<div style="color:#ff4d4d; padding:20px;">Lỗi kết nối mạng hoặc TV chưa có internet!<br><small>${err.message}</small></div>`;
            }
        }

        function updatePaginationUI() {
            let paginationContainer = document.getElementById('pagination-controls');
            paginationContainer.style.display = 'flex';
            document.getElementById('page-info').innerText = `Trang ${currentPage} / ${totalPages}`;
            document.getElementById('prev-btn').disabled = (currentPage <= 1);
            document.getElementById('next-btn').disabled = (currentPage >= totalPages);
        }

        function changePage(direction) {
            currentPage += direction;
            if (currentPage < 1) currentPage = 1;
            fetchFilteredMovies();
            window.scrollTo({ top: 400, behavior: 'smooth' });
        }

        function handleSearchKey(event) {
            if (event.key === 'Enter') {
                let keyword = document.getElementById('search-input').value.trim();
                if (keyword) performSearch(keyword);
            }
        }

        async function performSearch(keyword) {
            let row = document.getElementById('results-row');
            document.getElementById('results-title').innerText = `Kết quả tìm kiếm: "${keyword}"`;
            document.getElementById('pagination-controls').style.display = 'none';
            row.innerHTML = '<div style="color:var(--text-muted); padding:20px;">Đang tìm kiếm...</div>';

            try {
                let res = await fetch(`https://phimapi.com/v1/api/tim-kiem?keyword=${encodeURIComponent(keyword)}&limit=24`);
                let json = await res.json();
                let items = json.data?.items || json.items || [];

                row.innerHTML = '';
                if (items.length === 0) {
                    row.innerHTML = '<div style="color:var(--text-muted); padding:20px;">Không tìm thấy bộ phim nào.</div>';
                    return;
                }
                items.forEach(movie => row.appendChild(createMovieCard(movie, false)));
            } catch (err) {
                row.innerHTML = '<div style="color:red; padding:20px;">Lỗi kết nối tìm kiếm.</div>';
            }
        }

        async function getMovieDetails(slug, movieData) {
            try {
                let res = await fetch(`https://phimapi.com/phim/${slug}`);
                let data = await res.json();
                
                let fullMovieInfo = {
                    slug: slug,
                    name: data.movie?.name || movieData.name,
                    poster_url: data.movie?.poster_url || data.movie?.thumb_url || movieData.poster_url || movieData.thumb_url
                };
                saveToHistory(fullMovieInfo);

                let episodes = data.episodes;
                if (episodes && episodes.length > 0) {
                    let serverData = episodes[0].server_data;
                    if (serverData && serverData.length > 0) {
                        let playUrl = serverData[0].link_m3u8;
                        if (playUrl) {
                            playVideo(playUrl);
                            return;
                        }
                    }
                }
                alert('Phim này hiện chưa có link phát video!');
            } catch (error) {
                alert('Không thể lấy chi tiết phim!');
            }
        }

        function playVideo(url) {
            const container = document.getElementById('player-container');
            const video = document.getElementById('video-player');
            container.style.display = 'flex';

            if (container.requestFullscreen) {
                container.requestFullscreen().catch(err => {});
            } else if (container.webkitRequestFullscreen) {
                container.webkitRequestFullscreen();
            }

            if (url.includes('.m3u8')) {
                if (Hls.isSupported()) {
                    if (window.hlsInstance) window.hlsInstance.destroy();
                    const hls = new Hls();
                    window.hlsInstance = hls;
                    hls.loadSource(url);
                    hls.attachMedia(video);
                    hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(e => {}));
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = url;
                    video.play();
                }
            } else {
                video.src = url;
                video.play().catch(e => {});
            }
        }

        function closePlayer() {
            const container = document.getElementById('player-container');
            const video = document.getElementById('video-player');
            video.pause();
            video.removeAttribute('src');
            video.load(); 
            
            if (window.hlsInstance) {
                window.hlsInstance.destroy();
                window.hlsInstance = null;
            }

            if (document.exitFullscreen) {
                document.exitFullscreen().catch(err => {});
            } else if (document.webkitExitResponder) {
                document.webkitExitFullscreen();
            }

            container.style.display = 'none';
        }

        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape' || event.key === 'BrowserBack' || event.keyCode === 8) {
                const container = document.getElementById('player-container');
                if (container.style.display === 'flex') {
                    closePlayer();
                    event.preventDefault();
                }
            }
        });

        // Đảm bảo chạy init sau khi DOM tải xong
        window.onload = function() {
            initApp();
        };
    </script>
</body>
</html>
